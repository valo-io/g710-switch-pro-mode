name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build portable executable
        run: pyinstaller --onefile --console --name switch_mode switch_mode.py

      - name: Smoke test (exe starts and prints help)
        run: ./dist/switch_mode.exe --help

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch_mode-windows
          path: dist/switch_mode.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/switch_mode.exe
          generate_release_notes: true
