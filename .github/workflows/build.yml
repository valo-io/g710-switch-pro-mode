name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build portable executable
        run: pyinstaller --onefile --console --name switch_mode switch_mode.py

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/switch_mode.exe

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: switch_mode-windows
          path: dist/switch_mode.exe
          if-no-files-found: error

  test:
    name: Test
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: switch_mode-windows

      - name: Smoke test (exe starts and prints help)
        run: ./switch_mode.exe --help

  release:
    name: Release
    needs: [build, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: switch_mode-windows

      - name: Work out version tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create checksum
        run: sha256sum switch_mode.exe > switch_mode.exe.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          body: |
            Portable Windows build of `switch_mode.exe`. No installation or dependencies needed.

            **Verify this download** (requires the [GitHub CLI](https://cli.github.com/)):
            ```
            gh attestation verify switch_mode.exe --repo ${{ github.repository }}
            ```
            Or compare its SHA-256 with `switch_mode.exe.sha256`.
          files: |
            switch_mode.exe
            switch_mode.exe.sha256