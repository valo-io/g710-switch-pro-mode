<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nintendo Switch Mode Enabler</title>
</head>
<body>
    <p>Connect your Redragon G710 <strong>while this page is open</strong>. This only <em>attempts</em> to trigger Switch mode and cannot confirm it worked.</p>
    <p id="status">Polling started - waiting for connection...</p>

    <script>
        const statusEl = document.getElementById('status');

        // Start the tight polling loop immediately – this is the magic.
        setInterval(() => {
            navigator.getGamepads();
        }, 1);  // 1ms, identical to the original wavelovers code

        // Optional: just for visual feedback if the event fires quickly
        window.addEventListener('gamepadconnected', (event) => {
            statusEl.textContent = 'The browser detected a gamepad: ' + event.gamepad.id + '\nThis does NOT confirm Switch mode (it also appears for a normal controller). Please check in a game or app with native Nintendo Pro Controller support (e.g. an emulator) whether it behaves as a Pro Controller.';
        });
    </script>
</body>
</html>
